name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matriks toolchain yang stabil:
  #   p4a 2024.1.21  -> mem-build Python 3.11.5 untuk Android + NDK 25b
  #   Kivy 2.3.1     -> di-compile dengan Cython 0.29.x
  # Jangan naikkan p4a ke 2026.x: versi itu mem-build Python 3.14 dan
  # Kivy 2.3.1 gagal di-compile (Cython <=3.0.12 belum mendukung 3.14).
  BUILDOZER_VERSION: "1.5.0"
  P4A_VERSION: "2024.1.21"
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sinkronkan versi dari tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E '^version *=' buildozer.spec | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^version *=.*/version = ${VERSION}/" buildozer.spec
          echo "Versi yang dipakai: $VERSION"
          grep -E '^version *=' buildozer.spec

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependensi sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ccache cmake gettext git \
            libffi-dev libltdl-dev libssl-dev libtool openjdk-17-jdk \
            patch pkg-config python3-pip python3-setuptools python3-venv \
            unzip zip zlib1g-dev
          java -version

      - name: Install buildozer & python-for-android
        run: |
          python -m pip install --upgrade pip wheel "setuptools<70"
          # buildozer 1.5.0 tidak menarik Cython sebagai dependency, padahal
          # check_requirements() mewajibkan binary "cython" ada.
          python -m pip install "cython==0.29.36"
          python -m pip install \
            "buildozer==${BUILDOZER_VERSION}" \
            "python-for-android==${P4A_VERSION}"
          buildozer --version
          cython --version
          python -c "import pythonforandroid, os; print('p4a:', os.path.dirname(pythonforandroid.__file__))"

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ runner.os }}-${{ env.P4A_VERSION }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-${{ env.P4A_VERSION }}-
            buildozer-${{ runner.os }}-

      - name: Build APK (debug)
        shell: bash
        run: |
          # GitHub menjalankan bash dengan -e -o pipefail; matikan dulu supaya
          # kegagalan build tidak langsung menghentikan step sebelum log dicatat.
          set +e +o pipefail
          echo "--- buildozer.spec ---"
          grep -E '^(version|requirements|android\.|source\.)' buildozer.spec
          buildozer -v android debug 2>&1 | tee buildozer.log
          status=${PIPESTATUS[0]}
          echo "--- exit code buildozer: $status ---"
          tail -n 60 buildozer.log || true
          if [ "$status" -ne 0 ]; then
            # Laporkan 30 KB log terakhir sebagai annotation publik supaya bisa
            # didiagnosa tanpa login: GET /repos/{owner}/{repo}/check-runs/{id}/annotations
            python3 -c 'import os; t = open("buildozer.log", errors="replace").read() if os.path.exists("buildozer.log") else "log tidak ditemukan"; t = t[-30000:]; print("::error title=Buildozer gagal::" + t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi

      - name: Siapkan berkas rilis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          apks=(bin/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "Tidak ada APK yang dihasilkan!"
            echo "::error title=APK tidak ditemukan::Folder bin/ kosong setelah build selesai."
            exit 1
          fi
          for f in "${apks[@]}"; do
            cp "$f" "dist/Color-Willing-${{ steps.version.outputs.version }}-debug.apk"
          done
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Color-Willing-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Color-Willing-apk
          path: dist

      - name: Buat / perbarui Release
        uses: softprops/action-gh-release@v2
        with:
          name: Color Willing ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
